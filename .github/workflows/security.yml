# <target-repo>/.github/workflows/security.yml
name: security
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  govulncheck:
    uses: gr1m0h/.github/.github/workflows/govulncheck.yml@cc094601635f019d28b589165f646dc6a98b8607
  osv-scan:
    uses: gr1m0h/.github/.github/workflows/osv-scanner.yml@cc094601635f019d28b589165f646dc6a98b8607
    permissions:
      contents: read
      security-events: write
  gitleaks:
    uses: gr1m0h/.github/.github/workflows/gitleaks.yml@cc094601635f019d28b589165f646dc6a98b8607
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: gr1m0h/.github/.github/workflows/dependency-review.yml@cc094601635f019d28b589165f646dc6a98b8607
    permissions:
      contents: read
      pull-requests: write
  codeql:
    uses: gr1m0h/.github/.github/workflows/codeql-go.yml@cc094601635f019d28b589165f646dc6a98b8607
    permissions:
      contents: read
      security-events: write
      actions: read
  actionlint:
    uses: gr1m0h/.github/.github/workflows/actions-pin-lint.yml@cc094601635f019d28b589165f646dc6a98b8607
